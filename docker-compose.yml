services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB:       warehouse
      POSTGRES_USER:     warehouse
      POSTGRES_PASSWORD: warehouse
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PGHOST:              db
      PGPORT:              5432
      PGDATABASE:          warehouse
      PGUSER:              warehouse
      PGPASSWORD:          warehouse
      PORT:                3000
      FAILURE_RATE:        0.15
      WORKER_INTERVAL_MS:  2000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  pg_data:
